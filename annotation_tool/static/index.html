<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>torchkick annotator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---- toolbar ---- */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    #toolbar label { font-size: 13px; color: #aaa; }

    #toolbar select, #toolbar input[type=file] {
      background: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 13px;
    }

    .btn {
      background: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 5px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover { background: #3a3a3a; }
    .btn.active { background: #0078d4; border-color: #0078d4; color: #fff; }
    .btn:disabled { opacity: 0.4; cursor: default; }

    #status-msg {
      font-size: 12px;
      color: #f0a;
      min-width: 200px;
    }

    #progress-wrap {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #aaa;
    }
    #progress-bar-track {
      width: 140px; height: 6px;
      background: #333; border-radius: 3px; overflow: hidden;
    }
    #progress-bar-fill {
      height: 100%; width: 0%;
      background: #0078d4; border-radius: 3px;
      transition: width 0.3s;
    }

    /* ---- canvases ---- */
    #canvas-row {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 4px;
      padding: 4px;
    }

    .canvas-wrap {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      border: 1px solid #333;
      border-radius: 4px;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    /* ---- bottom bar ---- */
    #bottom-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 14px;
      background: #1a1a1a;
      border-top: 1px solid #333;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    #frame-nav { display: flex; align-items: center; gap: 6px; font-size: 13px; }

    #class-row { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    #class-row select {
      background: #2a2a2a; color: #e0e0e0;
      border: 1px solid #444; border-radius: 4px;
      padding: 4px 8px; font-size: 13px;
    }

    #selected-info { font-size: 12px; color: #aaa; }
  </style>
</head>
<body>

<!-- TOOLBAR -->
<div id="toolbar">
  <label>Video:</label>
  <input type="file" id="file-input" accept="video/*" />

  <label>Interval:</label>
  <select id="interval-select">
    <option value="1">1s</option>
    <option value="5" selected>5s</option>
    <option value="10">10s</option>
    <option value="20">20s</option>
    <option value="30">30s</option>
    <option value="60">60s</option>
  </select>

  <span style="width:1px; height:20px; background:#444;"></span>

  <button class="btn active" id="btn-select" title="Select / drag annotations (S)">Select</button>
  <button class="btn" id="btn-draw-bbox" title="Draw bounding box (B)">Draw Box</button>
  <button class="btn" id="btn-add-kp" title="Add keypoint (K)">Add KP</button>

  <span style="width:1px; height:20px; background:#444;"></span>

  <button class="btn" id="btn-undo" disabled title="Undo (⌘Z)">Undo</button>
  <button class="btn" id="btn-redo" disabled title="Redo (⌘⇧Z)">Redo</button>

  <span style="width:1px; height:20px; background:#444;"></span>

  <button class="btn" id="btn-flip-h" title="Flip pitch left/right">Flip ↔</button>
  <button class="btn" id="btn-flip-v" title="Flip pitch top/bottom">Flip ↕</button>

  <span style="width:1px; height:20px; background:#444;"></span>

  <button class="btn" id="btn-export" disabled>Export ZIP</button>

  <span id="status-msg"></span>
  <div id="progress-wrap">
    <div id="progress-bar-track"><div id="progress-bar-fill"></div></div>
    <span id="progress-label">0 / 0</span>
  </div>
</div>

<!-- CANVASES -->
<div id="canvas-row">
  <div class="canvas-wrap" id="frame-wrap">
    <canvas id="frame-canvas"></canvas>
  </div>
  <div class="canvas-wrap" id="pitch-wrap">
    <canvas id="pitch-canvas"></canvas>
  </div>
</div>

<!-- BOTTOM BAR -->
<div id="bottom-bar">
  <div id="frame-nav">
    <button class="btn" id="btn-prev" disabled>◀</button>
    <span id="frame-counter">— / —</span>
    <button class="btn" id="btn-next" disabled>▶</button>
  </div>

  <div id="class-row">
    <label id="class-label" style="display:none;">Class:</label>
    <select id="class-select" style="display:none;"></select>
  </div>

  <span id="selected-info"></span>

  <button class="btn" id="btn-delete" disabled>Delete</button>
  <button class="btn" id="btn-clear-frame" disabled title="Remove all annotations for this frame">Clear Frame</button>
  <button class="btn" id="btn-save" disabled>Save</button>
</div>

<script src="/static/annotator.js"></script>
</body>
</html>
