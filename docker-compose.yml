services:
  annotator:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads      # uploaded videos persist across restarts
      - ./models:/app/models        # mount local trained models here
      - ./weights:/app/weights      # fallback alternative mount
      - ./exports:/app/exports      # exported annotation zips land here
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PLAYER_WEIGHTS=/app/models/players/yolo11l.onnx
      - PITCH_WEIGHTS=/app/models/keypoints/heatmap.onnx
      - DEVICE=cuda
      - UPLOAD_DIR=/app/uploads
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
