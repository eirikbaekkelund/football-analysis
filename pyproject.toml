[tool.uv]
index-url = "https://pypi.org/simple"
extra-index-url = ["https://download.pytorch.org/whl/cu128"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torchkick"
dynamic = ["version"]
description = "Computer vision toolkit for football/soccer spatio-temporal analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Eirik Bækkelund", email = "eirikaab@icloud.com" }
]
keywords = [
    "football",
    "soccer",
    "computer-vision",
    "object-detection",
    "tracking",
    "sports-analytics",
    "pytorch",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.2.0",
    "Pillow>=9.0.0",
    "pydantic>=2.0.0",
    "tqdm>=4.65.0",
    "fsspec>=2023.1.0",
    "requests>=2.28.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "opencv-python>=4.7.0",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]

[project.optional-dependencies]
soccernet = [
    "SoccerNet>=0.1.0",
]
tracking = [
    "umap-learn>=0.5.0",
]
reid = [
    "transformers>=4.46.0",
    "peft>=0.13.0",
]
roboflow = [
    "roboflow>=1.0.0",
]
annotation = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
]
training = [
    "ultralytics>=8.0.0",
    "transformers>=4.46.0",
    "albumentations>=1.3.0",
    "wandb>=0.15.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
all = [
    "torchkick[annotation,soccernet,tracking,reid,roboflow,training,dev]",
]

[project.scripts]
torchkick = "torchkick.cli:main"

[project.urls]
Homepage = "https://github.com/eirikb/torchkick"
Documentation = "https://github.com/eirikb/torchkick#readme"
Repository = "https://github.com/eirikb/torchkick.git"
Issues = "https://github.com/eirikb/torchkick/issues"

[tool.hatch.version]
path = "src/torchkick/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "*.pt",
    "*.pth",
    "*.onnx",
    "/data",
    "/videos",
    "/soccernet/tracking",
    "/soccernet/calibration",
]

[tool.hatch.build.targets.wheel]
packages = ["src/torchkick"]

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.isort]
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pycln]
all = true
exclude = "__init__.py"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.semantic_release]
version_variables = ["src/torchkick/_version.py:__version__"]
changelog_file = "CHANGELOG.md"
upload_to_release = false
upload_to_pypi = false
patch_without_tag = true
commit_message = "{version} <- New Version Bump [skip ci]"

[tool.semantic_release.branches.develop]
match = "develop"


[tool.semantic_release.commit_parser_options]
allowed_types = [
    "build", "chore", "ci", "docs", "feat", "fix",
    "perf", "style", "refactor", "test"
]
minor_types = ["feat"]
patch_types = ["fix", "perf", "refactor", "style", "docs"]
